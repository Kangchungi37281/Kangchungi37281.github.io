<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HURDAT to ATCF 변환기 (업데이트 버전)</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --primary-hover: #2c5282;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #edf2f7;
            border-radius: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .io-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label.section-label {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .info-box {
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 4px 4px 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HURDAT to ATCF 변환 도구</h1>

    <div class="config-grid">
        <div class="form-group">
            <label for="basin">분지 (BASIN)</label>
            <select id="basin">
                <option value="WP">WP (서태평양)</option>
                <option value="AL">AL (대서양)</option>
                <option value="EP">EP (동태평양)</option>
                <option value="CP">CP (중태평양)</option>
                <option value="IO">IO (인도양)</option>
                <option value="SH">SH (남반구)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="cyNum">태풍 번호 (CY)</label>
            <input type="text" id="cyNum" value="01" placeholder="예: 01, 15">
        </div>
        <div class="form-group">
            <label for="stcName">태풍 이름 (STC_NAME)</label>
            <input type="text" id="stcName" value="UNNAMED" placeholder="예: EWINIAR">
        </div>
    </div>

    <div class="io-group">
        <label class="section-label" for="inputHurdat">HURDAT 입력</label>
        <textarea id="inputHurdat" placeholder="여기에 HURDAT 데이터를 붙여넣으세요. 헤더 줄이 포함되어 있어도 자동으로 걸러냅니다."></textarea>
    </div>

    <button onclick="convertHURDATtoATCF()">ATCF 형식으로 변환</button>

    <div class="io-group">
        <label class="section-label" for="outputAtcf">ATCF 출력 결과</label>
        <textarea id="outputAtcf" readonly placeholder="변환된 결과가 여기에 표시됩니다."></textarea>
    </div>

    <div class="info-box">
        <strong>⚙️ 업데이트 로그:</strong>
        <ul>
            <li>`MT012026...` 과 같은 메타데이터 헤더 행을 감지하여 자동으로 무시하고 데이터 라인만 파싱합니다.</li>
            <li>위도와 경도 필드의 소수점을 없애고 ATCF 표준 규격인 정수형 방위 표기 방식(`223N`, `1328E`, `1747W`)으로 변환합니다.</li>
        </ul>
    </div>
</div>

<script>
    const gradeMapping = {
        "TD": "TD", "TS": "TS", "HU": "HU", "TY": "TY", "ST": "ST", "TC": "TC",
        "SD": "SD", "SS": "SS",
        "EX": "EX", "LO": "LO", "DB": "DB", "WV": "WV", "MD": "MD"
    };

    // 위경도 변환 함수 (예: 22.3N -> 223N / 174.7W -> 1747W)
    function formatCoordinate(coordStr) {
        if (!coordStr) return "";
        // 숫자와 방위 문자만 추출
        const match = coordStr.match(/([0-9.]+)\s*([NSEWnsew])/);
        if (!match) return coordStr;

        const num = parseFloat(match[1]);
        const direction = match[2].toUpperCase();
        
        // 소수점에 10을 곱해 정수로 만듦 (예: 22.3 -> 223)
        const intNum = Math.round(num * 10);
        return intNum + direction;
    }

    function convertHURDATtoATCF() {
        const input = document.getElementById('inputHurdat').value.trim();
        const basin = document.getElementById('basin').value;
        const cy = document.getElementById('cyNum').value.trim().padStart(2, '0');
        const stcName = document.getElementById('stcName').value.trim().toUpperCase();

        if (!input) {
            alert('변환할 HURDAT 데이터를 입력해주세요.');
            return;
        }

        const lines = input.split('\n');
        const resultLines = [];

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine === '') return;

            // 끝에 붙은 쉼표 제거 처리
            if (cleanLine.endsWith(',')) {
                cleanLine = cleanLine.slice(0, -1);
            }

            const tokens = cleanLine.split(',').map(t => t.trim());

            // 헤더 행 건너뛰기 기법 (첫 토큰이 날짜가 아니거나 데이터 개수가 적은 경우)
            if (tokens[0].startsWith('MT') || tokens.length < 7) {
                return; 
            }

            // HURDAT 데이터 매핑
            const date = tokens[0];         // YYYYMMDD
            const time = tokens[1];         // HHMM
            const systemStatus = tokens[3];    // EX, TD, TS, HU 등
            const rawLat = tokens[4];       // 22.3N
            const rawLon = tokens[5];       // 132.8E
            const vmax = tokens[6];         // 20
            const mslp = tokens[7];         // 1009

            // YYYYMMDDHH 포맷 생성
            const yyyymmddhh = date + time.substring(0, 2);

            // 등급 코드 매핑
            const atcfTy = gradeMapping[systemStatus] || "XX";

            // 위경도 정수형 포맷 변환 수행
            const lat = formatCoordinate(rawLat);
            const lon = formatCoordinate(rawLon);

            // ATCF 30개 필드 배열 생성
            const atcfFields = Array(30).fill('');

            atcfFields[0] = basin;          // BASIN
            atcfFields[1] = cy;             // CY
            atcfFields[2] = yyyymmddhh;     // YYYYMMDDHH
            atcfFields[3] = "03";           // TECH_NUM
            atcfFields[4] = "BEST";         // TECH
            atcfFields[5] = "000";          // TAU
            atcfFields[6] = lat;            // LAT
            atcfFields[7] = lon;            // LON
            atcfFields[8] = vmax;           // VMAX
            atcfFields[9] = mslp;           // MSLP
            atcfFields[10] = atcfTy;        // TY
            atcfFields[11] = "34";          // RAD
            atcfFields[12] = "AAA";         // WINDCODE
            atcfFields[13] = "0";           // RAD1
            atcfFields[14] = "0";           // RAD2
            atcfFields[15] = "0";           // RAD3
            atcfFields[16] = "0";           // RAD4
            atcfFields[17] = "";            // RADP
            atcfFields[18] = "";            // RRP
            atcfFields[19] = "";            // MRD
            atcfFields[20] = "";            // GUSTS
            atcfFields[21] = "";            // EYE
            atcfFields[22] = "";            // SUBREGION
            atcfFields[23] = "";            // MAXWIND
            atcfFields[24] = "";            // HEAT_INDEX
            atcfFields[25] = "";            // CROSS_SECTION
            atcfFields[26] = "";            // RELATIVE_INTENSITY
            atcfFields[27] = "";            // AD_VMAX
            atcfFields[28] = "";            // AD_MSLP
            atcfFields[29] = stcName;       // STC_NAME

            resultLines.push(atcfFields.join(', '));
        });

        document.getElementById('outputAtcf').value = resultLines.join('\n');
    }
</script>

</body>
</html>
