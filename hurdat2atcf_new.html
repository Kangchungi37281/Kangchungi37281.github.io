<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HURDAT to ATCF 변환기 (옵션 토글 추가)</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --primary-hover: #2c5282;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #edf2f7;
            border-radius: 6px;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }

        .form-group.checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-group.checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            user-select: none;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .io-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        label.section-label {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .info-box {
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 4px 4px 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HURDAT to ATCF 변환 도구</h1>

    <div class="config-grid">
        <div class="form-group">
            <label for="basin">분지 (BASIN)</label>
            <select id="basin">
                <option value="WP">WP (서태평양)</option>
                <option value="AL">AL (대서양)</option>
                <option value="EP">EP (동태평양)</option>
                <option value="CP">CP (중태평양)</option>
                <option value="IO">IO (인도양)</option>
                <option value="SH">SH (남반구)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="cyNum">태풍 번호 (CY)</label>
            <input type="text" id="cyNum" value="01" placeholder="예: 01, 15">
        </div>
        <div class="form-group">
            <label for="stcName">태풍 이름 (STC_NAME)</label>
            <input type="text" id="stcName" value="UNNAMED" placeholder="예: EWINIAR">
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" id="convertHuToTy" checked>
            <label for="convertHuToTy"><strong>HU ➔ TY 변환</strong></label>
        </div>
    </div>

    <div class="io-group">
        <label class="section-label" for="inputHurdat">HURDAT 입력</label>
        <textarea id="inputHurdat" placeholder="여기에 HURDAT 데이터를 붙여넣으세요."></textarea>
    </div>

    <button onclick="convertHURDATtoATCF()">ATCF 형식으로 변환</button>

    <div class="io-group">
        <label class="section-label" for="outputAtcf">ATCF 출력 결과</label>
        <textarea id="outputAtcf" readonly placeholder="변환된 결과가 여기에 표시됩니다."></textarea>
    </div>

    <div class="info-box">
        <strong>⚙️ 토글 옵션 안내:</strong>
        <ul>
            <li>설정창의 <strong>[HU ➔ TY 변환]</strong> 체크박스를 선택하면, HURDAT의 `HU` 코드가 ATCF에서 `TY`로 변경됩니다.</li>
            <li>체크박스를 해제하면 기존 규격대로 `HU` 등급이 유지되어 출력됩니다.</li>
        </ul>
    </div>
</div>

<script>
    // 기본 매핑 테이블 구성
    const baseGradeMapping = {
        "TD": "TD", "TS": "TS", "TY": "TY", "ST": "ST", "TC": "TC",
        "SD": "SD", "SS": "SS",
        "EX": "EX", "LO": "LO", "DB": "DB", "WV": "WV", "MD": "MD"
    };

    function formatCoordinate(coordStr) {
        if (!coordStr) return "";
        const match = coordStr.match(/([0-9.]+)\s*([NSEWnsew])/);
        if (!match) return coordStr;

        const num = parseFloat(match[1]);
        const direction = match[2].toUpperCase();
        
        const intNum = Math.round(num * 10);
        return intNum + direction;
    }

    function convertHURDATtoATCF() {
        const input = document.getElementById('inputHurdat').value.trim();
        const basin = document.getElementById('basin').value;
        const cy = document.getElementById('cyNum').value.trim().padStart(2, '0');
        const stcName = document.getElementById('stcName').value.trim().toUpperCase();
        
        // 체크박스 켜짐 여부 확인
        const shouldConvertHuToTy = document.getElementById('convertHuToTy').checked;

        if (!input) {
            alert('변환할 HURDAT 데이터를 입력해주세요.');
            return;
        }

        const lines = input.split('\n');
        const resultLines = [];

        lines.forEach(line => {
            let cleanLine = line.trim();
            if (cleanLine === '') return;

            if (cleanLine.endsWith(',')) {
                cleanLine = cleanLine.slice(0, -1);
            }

            const tokens = cleanLine.split(',').map(t => t.trim());

            if (tokens[0].startsWith('MT') || tokens.length < 7) {
                return; 
            }

            const date = tokens[0];
            const time = tokens[1];
            const systemStatus = tokens[3]; // EX, TD, TS, HU 등
            const rawLat = tokens[4];
            const rawLon = tokens[5];
            const vmax = tokens[6];
            const mslp = tokens[7];

            const yyyymmddhh = date + time.substring(0, 2);
            
            // 토글 스위치 상태에 따른 HU 세부 매핑 결정
            let atcfTy = baseGradeMapping[systemStatus] || "XX";
            if (systemStatus === "HU") {
                atcfTy = shouldConvertHuToTy ? "TY" : "HU";
            }

            const lat = formatCoordinate(rawLat);
            const lon = formatCoordinate(rawLon);

            const atcfFields = Array(30).fill('');

            atcfFields[0] = basin;
            atcfFields[1] = cy;
            atcfFields[2] = yyyymmddhh;
            atcfFields[3] = "03";
            atcfFields[4] = "BEST";
            atcfFields[5] = "000";
            atcfFields[6] = lat;
            atcfFields[7] = lon;
            atcfFields[8] = vmax;
            atcfFields[9] = mslp;
            atcfFields[10] = atcfTy; 
            atcfFields[11] = "34";
            atcfFields[12] = "AAA";
            atcfFields[13] = "0";
            atcfFields[14] = "0";
            atcfFields[15] = "0";
            atcfFields[16] = "0";
            atcfFields[17] = "";
            atcfFields[18] = "";
            atcfFields[19] = "";
            atcfFields[20] = "";
            atcfFields[21] = "";
            atcfFields[22] = "";
            atcfFields[23] = "";
            atcfFields[24] = "";
            atcfFields[25] = "";
            atcfFields[26] = "";
            atcfFields[27] = "";
            atcfFields[28] = "";
            atcfFields[29] = stcName;

            resultLines.push(atcfFields.join(', '));
        });

        document.getElementById('outputAtcf').value = resultLines.join('\n');
    }
</script>

</body>
</html>
