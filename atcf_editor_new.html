<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위키백과 스타일 열대저기압 ATCF 지도 변환기 및 에디터</title>
    <!-- Leaflet.js CSS 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #333;
            margin: 10px;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .control-panel {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .preview-panel {
            flex: 2;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 180px;
            font-family: monospace;
            font-size: 12px;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row .input-group {
            flex: 1;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #3085d6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
        }
        button:hover {
            background-color: #256cb4;
        }
        .secondary-btn {
            background-color: #e67e22;
            margin-top: 10px;
        }
        .secondary-btn:hover {
            background-color: #d35400;
        }
        .download-btn {
            background-color: #2ecc71;
            margin-top: 10px;
        }
        .download-btn:hover {
            background-color: #27ae60;
        }
        #map {
            width: 100%;
            height: 450px;
            border: 1px solid #ddd;
            border-radius: 4px;
            z-index: 1;
        }
        .legend {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 5px;
            margin-top: 15px;
            font-size: 12px;
            text-align: left;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #000;
        }
        .info {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            #map {
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <h1>🌀 열대성 저기압 ATCF 경로 지도 에디터</h1>
    <p class="info">ATCF 데이터를 붙여넣거나, 지도 위를 터치/클릭하여 트랙 노드를 추가·수정할 수 있습니다.</p>

    <div class="container">
        <!-- 컨트롤 패널 -->
        <div class="control-panel">
            <h3>1. ATCF 데이터 및 설정 제어</h3>
            
            <div class="input-row">
                <div class="input-group">
                    <label for="basinInput">분지 (Basin)</label>
                    <select id="basinInput" onchange="updateTextArea()">
                        <option value="WP">WP (서북태평양)</option>
                        <option value="AL">AL (북대서양)</option>
                        <option value="EP">EP (동태평양)</option>
                        <option value="CP">CP (중태평양)</option>
                        <option value="SH">SH (남반구)</option>
                        <option value="IO">IO (인도양)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="cycloneNumInput">태풍 번호</label>
                    <input type="text" id="cycloneNumInput" value="14" onchange="updateTextArea()">
                </div>
            </div>

            <div class="input-group">
                <label for="startDateInput">시작 날짜 및 시간</label>
                <input type="datetime-local" id="startDateInput" value="2026-11-05T00:00" onchange="updateTextArea()">
            </div>
            
            <textarea id="atcfData" placeholder="ATCF 데이터를 여기에 붙여넣거나 지도 위를 클릭하세요."></textarea>
            <button onclick="loadDataFromText()">🗺️ 텍스트로 지도고치기</button>
            <button class="secondary-btn" onclick="clearAllPoints()">🗑️ 모든 포인트 초기화</button>
            <button class="download-btn" id="downloadBtn" onclick="exportMapImage()">💾 현재 지도 내보내기 (안내)</button>
            
            <h3>🎨 범례 (Saffir-Simpson 스케일)</h3>
            <div class="legend" id="legendView"></div>
        </div>

        <!-- 미리보기 패널 -->
        <div class="preview-panel">
            <h3>2. 인터랙티브 지도 에디터</h3>
            <p class="info" style="margin-top:0;">지도 위를 터치하여 새로운 트랙 노드를 추가하세요. (6시간 간격)</p>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet.js JS 불러오기 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const COLOR_SCALE = [
            { max: 33, color: '#5ebaff', label: '열대저압부 (TD, <34 kt)' },
            { max: 63, color: '#00faf4', label: '열대폭풍 (TS, 34-63 kt)' },
            { max: 82, color: '#ffffcc', label: '1등급 태풍 (64-82 kt)' },
            { max: 95, color: '#ffe775', label: '2등급 태풍 (83-95 kt)' },
            { max: 112, color: '#ffc140', label: '3등급 메이저 (96-112 kt)' },
            { max: 136, color: '#ff8f20', label: '4등급 메이저 (113-136 kt)' },
            { max: 999, color: '#ff6060', label: '5등급 메이저 (≥137 kt)' }
        ];

        const SUBTROPICAL_TYPES = ["SD", "SS"];
        const EXTRATROPICAL_TYPES = ["EX", "MD", "IN", "DS", "LO", "WV", "ET", "DB"];

        // 범례 UI 생성
        const legendView = document.getElementById('legendView');
        COLOR_SCALE.forEach(item => {
            legendView.innerHTML += `
                <div class="legend-item">
                    <div class="color-box" style="background:${item.color}"></div>
                    <span>${item.label}</span>
                </div>`;
        });

        // Leaflet 지도 초기화
        const map = L.map('map').setView([20, 130], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let currentPoints = [];
        let polylineLayer = null;
        let markerLayers = [];

        function getIntensityColor(knots) {
            for (let scale of COLOR_SCALE) {
                if (knots <= scale.max) return scale.color;
            }
            return '#ffffff';
        }

        function parseCoordinate(coordStr) {
            const match = coordStr.trim().match(/^(\d+)([NSEW])$/);
            if (!match) return null;
            let val = parseFloat(match[1]) / 10.0;
            const dir = match[2];
            if (dir === 'S' || dir === 'W') val = -val;
            return val;
        }

        function formatCoordinate(val, isLat) {
            const absVal = Math.abs(val);
            const intPart = Math.floor(absVal * 10).toString().padStart(isLat ? 3 : 4, '0');
            let dir = '';
            if (isLat) {
                dir = val >= 0 ? 'N' : 'S';
            } else {
                dir = val >= 0 ? 'E' : 'W';
            }
            return intPart + dir;
        }

        function formatAtcfDate(date) {
            const y = date.getUTCFullYear();
            const m = String(date.getUTCMonth() + 1).padStart(2, '0');
            const d = String(date.getUTCDate()).padStart(2, '0');
            const h = String(date.getUTCHours()).padStart(2, '0');
            return `${y}${m}${d}${h}`;
        }

        function updateTextArea() {
            const basin = document.getElementById('basinInput').value;
            const cycloneNum = document.getElementById('cycloneNumInput').value.trim().padStart(2, '0');
            const startInputVal = document.getElementById('startDateInput').value;
            let baseDate = startInputVal ? new Date(startInputVal) : new Date('2026-11-05T00:00:00Z');

            let textOutput = '';
            currentPoints.forEach((p, index) => {
                const latStr = formatCoordinate(p.lat, true);
                const lonStr = formatCoordinate(p.lon, false);
                let pointDate = new Date(baseDate.getTime() + index * 6 * 60 * 60 * 1000);
                const dateStr = formatAtcfDate(pointDate);

                const pressureStr = String(p.pressure).padStart(4, ' ');
                const knotsStr = String(p.knots).padStart(3, ' ');
                const stormType = p.stormType || 'TY';
                textOutput += `${basin}, ${cycloneNum}, ${dateStr}, 03, JTWC, 000, ${latStr}, ${lonStr}, ${knotsStr}, ${pressureStr}, ${stormType}\n`;
            });
            document.getElementById('atcfData').value = textOutput;
        }

        function renderMap() {
            if (polylineLayer) map.removeLayer(polylineLayer);
            markerLayers.forEach(m => map.removeLayer(m));
            markerLayers = [];

            if (currentPoints.length === 0) return;

            const latlngs = currentPoints.map(p => [p.lat, p.lon]);
            polylineLayer = L.polyline(latlngs, {color: '#ffffff', weight: 4, opacity: 0.9}).addTo(map);

            currentPoints.forEach((p, idx) => {
                const color = getIntensityColor(p.knots);
                const st = p.stormType || 'TY';
                
                let shapeStyle = 'border-radius: 50%;';
                if (SUBTROPICAL_TYPES.includes(st)) {
                    shapeStyle = 'border-radius: 2px;';
                } else if (EXTRATROPICAL_TYPES.includes(st)) {
                    shapeStyle = 'width: 0; height: 0; background-color: transparent !important; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid ' + color + '; border-top: none; border-radius: 0; box-shadow: none;';
                }

                let markerHtml = '';
                if (EXTRATROPICAL_TYPES.includes(st)) {
                    markerHtml = `<div style="${shapeStyle}"></div>`;
                } else {
                    markerHtml = `
                        <div style="
                            background-color: ${color}; 
                            width: 14px; 
                            height: 14px; 
                            ${shapeStyle}
                            border: 2px solid #000;
                            box-shadow: 0 0 4px rgba(0,0,0,0.6);">
                        </div>`;
                }
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: markerHtml,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const marker = L.marker([p.lat, p.lon], {icon: customIcon}).addTo(map);
                
                marker.bindPopup(`
                    <b>노드 #${idx + 1}</b><br>
                    위치: ${p.lat.toFixed(1)}°, ${p.lon.toFixed(1)}°<br>
                    풍속(kt): <input type="number" id="knots-${idx}" value="${p.knots}" style="width:60px;" min="10" max="200" oninput="updatePointData(${idx})"><br>
                    기압(hPa): <input type="number" id="pressure-${idx}" value="${p.pressure}" style="width:60px;" min="850" max="1050" oninput="updatePointData(${idx})"><br>
                    등급: 
                    <select id="stormType-${idx}" style="width:70px;" onchange="updatePointData(${idx})">
                        <optgroup label="열대저기압">
                            <option value="TY" ${st==='TY'?'selected':''}>TY</option>
                            <option value="TD" ${st==='TD'?'selected':''}>TD</option>
                            <option value="TS" ${st==='TS'?'selected':''}>TS</option>
                            <option value="ST" ${st==='ST'?'selected':''}>ST</option>
                            <option value="TC" ${st==='TC'?'selected':''}>TC</option>
                            <option value="HU" ${st==='HU'?'selected':''}>HU</option>
                            <option value="XX" ${st==='XX'?'selected':''}>XX</option>
                        </optgroup>
                        <optgroup label="아열대저기압">
                            <option value="SD" ${st==='SD'?'selected':''}>SD</option>
                            <option value="SS" ${st==='SS'?'selected':''}>SS</option>
                        </optgroup>
                        <optgroup label="비열대저기압">
                            <option value="EX" ${st==='EX'?'selected':''}>EX</option>
                            <option value="MD" ${st==='MD'?'selected':''}>MD</option>
                            <option value="IN" ${st==='IN'?'selected':''}>IN</option>
                            <option value="DS" ${st==='DS'?'selected':''}>DS</option>
                            <option value="LO" ${st==='LO'?'selected':''}>LO</option>
                            <option value="WV" ${st==='WV'?'selected':''}>WV</option>
                            <option value="ET" ${st==='ET'?'selected':''}>ET</option>
                            <option value="DB" ${st==='DB'?'selected':''}>DB</option>
                        </optgroup>
                    </select><br>
                    <button style="background:#e74c3c; color:white; margin-top:8px;" onclick="deletePoint(${idx})">이 포인트 삭제</button>
                `);

                markerLayers.push(marker);
            });
        }

        function loadDataFromText() {
            const rawData = document.getElementById('atcfData').value;
            const lines = rawData.split('\n');
            currentPoints = [];
            let firstDateStr = null;

            lines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 10) {
                    if (parts[0] && parts[0].trim()) {
                        document.getElementById('basinInput').value = parts[0].trim();
                    }
                    if (parts[1] && parts[1].trim()) {
                        document.getElementById('cycloneNumInput').value = parts[1].trim();
                    }
                    if (!firstDateStr && parts[2]) {
                        firstDateStr = parts[2].trim();
                    }
                    const lat = parseCoordinate(parts[6]);
                    const lon = parseCoordinate(parts[7]);
                    const knots = parseInt(parts[8].trim(), 10);
                    const pressure = parseInt(parts[9].trim(), 10) || 980;
                    let stormType = 'TY';
                    if (parts.length >= 11 && parts[10].trim()) {
                        stormType = parts[10].trim();
                    }
                    
                    if (lat !== null && lon !== null && !isNaN(knots)) {
                        currentPoints.push({ lat, lon, knots, pressure, stormType });
                    }
                }
            });

            if (firstDateStr && firstDateStr.length >= 10) {
                const y = firstDateStr.substring(0, 4);
                const mo = firstDateStr.substring(4, 6);
                const d = firstDateStr.substring(6, 8);
                const h = firstDateStr.substring(8, 10);
                document.getElementById('startDateInput').value = `${y}-${mo}-${d}T${h}:00`;
            }

            renderMap();
            if (currentPoints.length > 0) {
                const bounds = L.latLngBounds(currentPoints.map(p => [p.lat, p.lon]));
                map.fitBounds(bounds, {padding: [50, 50]});
            }
        }

        map.on('click', function(e) {
            const lat = Math.round(e.latlng.lat * 10) / 10;
            const lon = Math.round(e.latlng.lng * 10) / 10;
            
            currentPoints.push({ lat, lon, knots: 50, pressure: 980, stormType: 'TY' });
            updateTextArea();
            renderMap();
        });

        window.updatePointData = function(idx) {
            const inputKnots = parseInt(document.getElementById(`knots-${idx}`).value, 10);
            const inputPressure = parseInt(document.getElementById(`pressure-${idx}`).value, 10);
            const inputStormType = document.getElementById(`stormType-${idx}`).value;
            
            if (!isNaN(inputKnots)) {
                currentPoints[idx].knots = inputKnots;
            }
            if (!isNaN(inputPressure)) {
                currentPoints[idx].pressure = inputPressure;
            }
            if (inputStormType) {
                currentPoints[idx].stormType = inputStormType;
            }
            
            updateTextArea();
            renderMap();
        };

        window.deletePoint = function(idx) {
            currentPoints.splice(idx, 1);
            updateTextArea();
            renderMap();
            map.closePopup();
        };

        function clearAllPoints() {
            currentPoints = [];
            document.getElementById('atcfData').value = '';
            renderMap();
        }

        function exportMapImage() {
            alert("모바일 환경에서는 브라우저 메뉴의 '화면 캡처' 또는 '스크린샷' 기능을 이용하여 지도를 저장하시기 바랍니다.");
        }
    </script>
</body>
</html>
